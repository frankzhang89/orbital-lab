name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build (${{ matrix.os }})
    if: ${{ !github.event.deleted }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Build release ZIP
        run: npm run package
      - name: Smoke-test the release package
        run: npm run smoke
      - name: Upload release ZIP
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: orbital-lab-release
          path: release/orbital-lab-*.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: orbital-lab-release
          path: release
      - name: Create release and attach ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/orbital-lab-*.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
